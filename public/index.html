<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setups.Bike: tire and suspension settings for every bike</title>
    <meta name="description" content="Save tire pressure, fork and shock settings, tokens and named setups for every bike in your garage. Log how each ride felt and share a setup with a link." />

    <!-- Icons. Regenerate them with scripts/make-icons.py -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The header logo is the largest thing on screen: start fetching it before the app's JS runs -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/img/logos/setups-logo.svg" type="image/svg+xml" fetchpriority="high" />

    <!-- Open connections early to Google sign-in and the Setups.Bike API -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://l7s3m81i09.execute-api.us-west-1.amazonaws.com" crossorigin />

    <!-- Browser bar color: matches the gold header in light and dark mode -->
    <meta name="theme-color" content="#daa520" />
    <meta name="color-scheme" content="light dark" />

    <!-- Home-screen app (iOS and Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Setups.Bike" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Setups.Bike" />

    <!-- Link previews (iMessage, Slack, Facebook, X...). The site is static, so every link,
         shared setups included, gets this same preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Setups.Bike" />
    <meta property="og:title" content="Setups.Bike: tire and suspension settings for every bike" />
    <meta property="og:description" content="Save tire pressure, fork and shock settings for every bike, log how each ride felt, and share a setup with a link." />
    <meta property="og:url" content="https://setups.bike/" />
    <meta property="og:image" content="https://setups.bike/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Setups.Bike logo: tire pressure and suspension settings, saved for every bike." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Setups.Bike: tire and suspension settings for every bike" />
    <meta name="twitter:description" content="Save tire pressure, fork and shock settings for every bike, log how each ride felt, and share a setup with a link." />
    <meta name="twitter:image" content="https://setups.bike/og-image.png" />
    <link rel="canonical" href="https://setups.bike/" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
