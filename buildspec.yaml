version: 0.2
env:
  variables:
    # Skip source maps: faster builds, and the site doesn't publish a readable copy of the source.
    GENERATE_SOURCEMAP: "false"
phases:
  install:
    #If you use the Ubuntu standard image 2.0 or later, you must specify runtime-versions.
    #If you specify runtime-versions and use an image other than Ubuntu standard image 2.0, the build fails.
    runtime-versions:
      nodejs: 16
  pre_build:
    commands:
      - echo Installing source NPM dependencies...
      # npm ci installs exactly what package-lock.json says, and is faster than npm install
      - npm ci --no-audit --no-fund
  build:
    commands:
      - echo Build started on 'date'
      - npm run build
  post_build:
    commands:
      - aws s3 cp --recursive --acl public-read ./build s3://setups.bike/
      - aws s3 cp --acl public-read --cache-control="max-age=0, no-cache, no-store, must-revalidate" ./build/index.html s3://setups.bike/
      # the service worker and manifest must never be cached, or app updates get stuck
      - aws s3 cp --acl public-read --cache-control="max-age=0, no-cache, no-store, must-revalidate" ./build/service-worker.js s3://setups.bike/
      - aws s3 cp --acl public-read --cache-control="max-age=0, no-cache, no-store, must-revalidate" ./build/manifest.json s3://setups.bike/
      #- aws cloudfront create-invalidation --distribution-id <cloudfront-distribution-id> --paths /index.html
artifacts:
  files:
    - "build/*"
    - "build/**/*"
